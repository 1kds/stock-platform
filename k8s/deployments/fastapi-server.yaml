apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-server
  namespace: stock-platform
  labels:
    app: fastapi-server
    team: team8
    type: deployment
    tier: service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fastapi-server
  template:
    metadata:
      labels:
        app: fastapi-server
        team: team8
    spec:
      nodeSelector:
        kubernetes.io/hostname: worker3
      containers:
        - name: fastapi-server
          image: master:5000/stock-platform/fastapi-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: HDFS_BASE
              value: "hdfs://namenode:9000"
            - name: YEAR
              value: "2026"
            - name: MONTH
              value: "06"
            - name: DAY
              value: "07"
            - name: DATA_FORMAT
              value: "parquet"
            # HDFS 실연동: false / Mock 테스트: true
            - name: USE_MOCK
              value: "false"
            - name: DART_API_KEY
              valueFrom:
                secretKeyRef:
                  name: external-api-keys
                  key: DART_API_KEY
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
