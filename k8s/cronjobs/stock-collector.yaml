apiVersion: batch/v1
kind: CronJob
metadata:
  name: stock-collector
  namespace: stock-platform
  labels:
    app: stock-collector
    team: team8
    type: cronjob
    tier: collector
spec:
  # 평일 20:00 KST (UTC+9 → UTC 11:00)
  schedule: "0 11 * * 1-5"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: stock-collector
            team: team8
        spec:
          nodeSelector:
            kubernetes.io/hostname: worker1
          restartPolicy: OnFailure
          containers:
            - name: stock-collector
              image: master:5000/stock-platform/stock-collector:latest
              imagePullPolicy: Always
              env:
                - name: HDFS_BASE
                  value: "hdfs://namenode:9000"
                - name: YEAR
                  value: "2026"
                - name: MONTH
                  value: "06"
                - name: DAY
                  value: "07"
                - name: DATA_FORMAT
                  value: "parquet"
                # KRX 로그인 (pykrx)
                - name: KRX_ID
                  valueFrom:
                    secretKeyRef:
                      name: external-api-keys
                      key: KRX_ID
                - name: KRX_PW
                  valueFrom:
                    secretKeyRef:
                      name: external-api-keys
                      key: KRX_PW
              resources:
                requests:
                  cpu: "250m"
                  memory: "512Mi"
                limits:
                  cpu: "500m"
                  memory: "1Gi"
