apiVersion: batch/v1
kind: CronJob
metadata:
  name: news-collector
  namespace: stock-platform
  labels:
    app: news-collector
    team: team8
    type: cronjob
    tier: collector
spec:
  # 평일 20:40 KST (UTC 11:40)
  schedule: "40 11 * * 1-5"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: news-collector
            team: team8
        spec:
          nodeSelector:
            kubernetes.io/hostname: worker1
          restartPolicy: OnFailure
          containers:
            - name: news-collector
              image: master:5000/stock-platform/news-collector:latest
              imagePullPolicy: Always
              env:
                - name: HDFS_BASE
                  value: "hdfs://namenode:9000"
                - name: YEAR
                  value: "2026"
                - name: MONTH
                  value: "06"
                - name: DAY
                  value: "07"
                - name: DATA_FORMAT
                  value: "parquet"
                # 네이버 API (optional=true → 없어도 Pod 실행됨)
                - name: NAVER_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      name: external-api-keys
                      key: NAVER_CLIENT_ID
                      optional: true
                - name: NAVER_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: external-api-keys
                      key: NAVER_CLIENT_SECRET
                      optional: true
              resources:
                requests:
                  cpu: "250m"
                  memory: "256Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"
