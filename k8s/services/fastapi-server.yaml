apiVersion: v1
kind: Service
metadata:
  name: fastapi-server
  namespace: stock-platform
  labels:
    app: fastapi-server
    team: team8
spec:
  type: NodePort
  selector:
    app: fastapi-server
  ports:
    - name: http
      protocol: TCP
      port: 8000        # 클러스터 내부 포트
      targetPort: 8000  # Pod 컨테이너 포트
      nodePort: 30080   # 외부 접근: master IP:30080
