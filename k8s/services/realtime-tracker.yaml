apiVersion: v1
kind: Service
metadata:
  name: realtime-tracker
  namespace: stock-platform
  labels:
    app: realtime-tracker
    team: team8
spec:
  # ClusterIP: 외부 노출 없이 fastapi-server에서 내부 호출만 함
  type: ClusterIP
  selector:
    app: realtime-tracker
  ports:
    - name: http
      protocol: TCP
      port: 8001
      targetPort: 8001
