apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: stock-platform
  labels:
    app: dashboard
    team: team8
spec:
  type: NodePort
  selector:
    app: dashboard
  ports:
    - name: http
      protocol: TCP
      port: 3000        # 클러스터 내부 포트
      targetPort: 3000  # Pod 컨테이너 포트
      nodePort: 30000   # 외부 접근: master IP:30000
